<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Math Quiz Registration</title></head>
<body>
<table style="margin:auto">
  <tr><td><h2 style="color:SlateBlue;text-align:center">MATH QUIZ REGISTRATION</h2></td></tr>
</table>
<table style="margin:auto;background:#f2f2ff;border:1px solid gray">
  <tr><td><br>
    <form action="RegisterServlet" method="post">
      <div style="text-align:right"><label>First name</label><input type="text" name="firstname" required></div><br>
      <div style="text-align:right"><label>Last name</label><input type="text" name="lastname" required></div><br>
      <div style="text-align:right"><label>Email</label><input type="text" name="username" required></div><br>
      <div style="text-align:right"><label>Password</label><input type="password" name="password" required></div><br>
      <div style="text-align:center">
        <button type="submit">Register</button>
        <input type="reset" value="Reset">
      </div>
    </form>
  </td></tr>
</table>
<table style="margin:auto"><tr><td><br><a href="index.html">Back</a></td></tr></table>
</body></html>
