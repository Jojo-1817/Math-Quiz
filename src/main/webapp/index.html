<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Math Quiz Login</title></head>
<body>
<table style="margin:auto">
  <tr><td><h2 style="color:SlateBlue;text-align:center">MATH QUIZ LOGIN</h2></td></tr>
</table>
<table style="margin:auto;background:#f2f2ff;border:1px solid gray">
  <tr><td style="text-align:center">
    <br>
    <a href="register.html"><b>Register?</b></a>&nbsp;&nbsp;
    <a href="passwordReset.html"><b>Password Reset?</b></a>
    <br><br>
  </td></tr>
  <tr><td>
    <form action="LoginServlet" method="post">
      <div style="text-align:right">
        <label>Email</label>
        <input type="text" name="username" required>
      </div><br>
      <div style="text-align:right">
        <label>Password</label>
        <input type="password" name="password" required>
      </div><br>
      <div style="text-align:center">
        <button type="submit">Login</button>
        <input type="reset" value="Reset">
      </div>
    </form>
  </td></tr>
</table>
</body></html>
